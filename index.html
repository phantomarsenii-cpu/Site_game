  .backdrop::after{
    content:'';
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(10,5,20,.55) 0%, rgba(10,5,20,.75) 40%, var(--void) 92%),
      linear-gradient(90deg, rgba(10,5,20,.5), transparent 40%, transparent 60%, rgba(10,5,20,.5));
  }

  /* ---------- ambient aurora background ---------- */
  .aurora{ position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(60px); opacity:.8; }
  .aurora span{
    position:absolute; border-radius:50%;
    mix-blend-mode:screen;
  }
  .a1{ width:60vw; height:60vw; left:-15vw; top:-10vw; background:radial-gradient(circle, rgba(139,92,246,.55), transparent 65%); animation:auroraMove1 16s ease-in-out infinite; }
  .a2{ width:55vw; height:55vw; right:-18vw; top:8vw; background:radial-gradient(circle, rgba(225,88,251,.42), transparent 65%); animation:auroraMove2 20s ease-in-out infinite; }
  .a3{ width:70vw; height:70vw; left:10vw; bottom:-30vw; background:radial-gradient(circle, rgba(93,63,211,.4), transparent 65%); animation:auroraMove3 24s ease-in-out infinite; }
  @keyframes auroraMove1{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(6vw,8vw) scale(1.15);} }
  @keyframes auroraMove2{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-8vw,4vw) scale(1.1);} }
  @keyframes auroraMove3{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(4vw,-6vw) scale(1.12);} }

  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(167,139,250,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,.06) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 70% 55% at 50% 15%, black 15%, transparent 70%);
    animation:driftGrid 44s linear infinite;
  }
  @keyframes driftGrid{ from{background-position:0 0;} to{background-position:0 440px;} }

  .vignette{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, transparent 30%, var(--void) 90%);
  }

  /* twinkling star sparkles */
  .sparkles{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .spark{
    position:absolute; border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px 1px rgba(255,255,255,.85);
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.1; transform:scale(.7);} 50%{ opacity:1; transform:scale(1);} }

  /* page-wide light sweep */
  .page-sweep{
    position:fixed; top:-50%; left:-30%; width:55%; height:220%; z-index:1; pointer-events:none;
    background:linear-gradient(100deg, transparent 42%, rgba(255,255,255,.05) 48%, rgba(139,92,246,.14) 52%, transparent 58%);
    animation:pageSweep 12s ease-in-out infinite 2s;
  }
  @keyframes pageSweep{
    0%{ transform:translateX(-20%) rotate(6deg); opacity:0; }
    8%{ opacity:1; }
    45%{ transform:translateX(260%) rotate(6deg); opacity:1; }
    55%{ opacity:0; }
    100%{ transform:translateX(260%) rotate(6deg); opacity:0; }
  }

  /* floating embers */
  .embers{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .ember{
    position:absolute; bottom:-10px; border-radius:50%;
    background:var(--violet-soft);
    box-shadow:0 0 8px 2px rgba(167,139,250,.7);
    opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.9; }
    90%{ opacity:.4; }
    100%{ transform:translateY(-115vh) translateX(var(--drift, 20px)); opacity:0; }
  }

  /* ---------- falling grenades ---------- */
  .nades{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .nade{ position:absolute; top:0; }

  .nade-body{
    animation: nadeFall var(--dur) linear var(--delay) infinite;
    will-change: transform, opacity;
  }
  /* purple-tinted to match the site palette */
  .nade-img{
    display:block; width:100%; height:auto;
    filter:
      hue-rotate(165deg) saturate(2.3) brightness(.95)
      drop-shadow(0 0 8px rgba(139,92,246,.55))
      drop-shadow(0 2px 6px rgba(0,0,0,.55));
    opacity:.88;
  }
  @keyframes nadeFall{
    0%{   transform:translateY(-16vh) rotate(0deg); opacity:0; }
    7%{   opacity:.88; }
    64%{  transform:translateY(var(--stop)) rotate(var(--rot)); opacity:.88; }
    69%{  transform:translateY(var(--stop)) rotate(var(--rot)); opacity:0; }
    100%{ transform:translateY(var(--stop)) rotate(var(--rot)); opacity:0; }
  }

  .nade-fx{
    position:absolute; left:50%; top:0; width:0; height:0;
    transform:translate(-50%,0) translateY(var(--stop));
  }

  /* -- frag / c4 / molotov: soft bloom + bright core + double shockwave + debris -- */
  @keyframes fxGlow{
    0%,60%{ opacity:0; transform:translate(-50%,-50%) scale(.4); }
    66%{    opacity:.65; transform:translate(-50%,-50%) scale(1); }
    84%{    opacity:0; transform:translate(-50%,-50%) scale(2.4); }
    100%{   opacity:0; }
  }
  @keyframes fxCore{
    0%,62%{  opacity:0; transform:translate(-50%,-50%) scale(.2); }
    66%{     opacity:1; transform:translate(-50%,-50%) scale(1); }
    76%{     opacity:0; transform:translate(-50%,-50%) scale(1.9); }
    100%{    opacity:0; }
  }
  @keyframes fxRing{
    0%,62%{  opacity:0; transform:translate(-50%,-50%) scale(.3); }
    66%{     opacity:.95; transform:translate(-50%,-50%) scale(1); }
    80%{     opacity:0; transform:translate(-50%,-50%) scale(4.2); }
    100%{    opacity:0; }
  }
  @keyframes fxDebris{
    0%,62%{ opacity:0; transform:translate(-50%,-50%) translate(0,0) scale(.5); }
    67%{    opacity:1; transform:translate(-50%,-50%) translate(0,0) scale(1); }
    100%{   opacity:0; transform:translate(-50%,-50%) translate(var(--dx,24px),var(--dy,-24px)) scale(.2); }
  }

  .fx-frag::before, .fx-c4::before, .fx-molotov::before{
    content:''; position:absolute; left:0; top:0; width:130px; height:130px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.85) 0%, rgba(225,88,251,.5) 24%, rgba(139,92,246,.3) 48%, transparent 74%);
    filter:blur(7px);
    animation:fxGlow var(--dur) linear var(--delay) infinite;
  }
  .fx-frag::after, .fx-c4::after, .fx-molotov::after{
    content:''; position:absolute; left:0; top:0; width:42px; height:42px;
    border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--magenta) 34%, var(--violet) 62%, transparent 78%);
    animation:fxCore var(--dur) linear var(--delay) infinite;
  }
  .fx-c4::before{ width:180px; height:180px; }
  .fx-c4::after{ width:62px; height:62px; }
  .fx-molotov::before{ width:96px; height:96px; background:radial-gradient(circle, rgba(255,255,255,.85) 0%, rgba(255,179,92,.45) 20%, rgba(225,88,251,.38) 46%, transparent 74%); }
  .fx-molotov::after{ width:34px; height:34px; background:radial-gradient(circle, #fff 0%, #ffcf8a 22%, var(--magenta) 56%, transparent 78%); }

  .fx-frag .ring, .fx-c4 .ring, .fx-molotov .ring{
    position:absolute; left:0; top:0; width:16px; height:16px;
    border-radius:50%; border:2px solid var(--violet-soft);
    box-shadow:0 0 24px 3px rgba(167,139,250,.75);
    animation:fxRing var(--dur) linear var(--delay) infinite;
  }
  .fx-frag .ring2, .fx-c4 .ring2, .fx-molotov .ring2{
    position:absolute; left:0; top:0; width:16px; height:16px;
    border-radius:50%; border:2px solid var(--magenta);
    animation:fxRing var(--dur) linear calc(var(--delay) + .08s) infinite;
  }
  .fx-c4 .ring, .fx-c4 .ring2{ width:22px; height:22px; border-width:3px; }

  .fx-frag .debris, .fx-c4 .debris, .fx-molotov .debris{
    position:absolute; left:0; top:0; width:5px; height:5px; border-radius:1px;
    background:var(--violet-soft);
    box-shadow:0 0 6px 1px rgba(167,139,250,.85);
    animation:fxDebris var(--dur) linear var(--delay) infinite;
  }

  /* -- smoke grenade: thick, slow-rising, dissipating cloud -- */
  @keyframes fxPuff{
    0%,56%{ opacity:0; transform:translate(-50%,-50%) translateY(0) scale(.3); }
    63%{    opacity:.88; transform:translate(-50%,-50%) translateY(-10px) scale(1); }
    100%{   opacity:0; transform:translate(-50%,-50%) translateY(-125px) scale(2.9); }
  }
  .fx-smoke .puff{
    position:absolute; left:0; top:0; width:44px; height:44px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(228,222,248,.8) 0%, rgba(150,120,200,.55) 42%, rgba(70,52,110,.3) 66%, transparent 82%);
    filter:blur(3px);
    opacity:0;
    animation:fxPuff var(--dur) linear var(--delay) infinite;
  }
  .fx-smoke .p1{ margin-left:-14px; }
  .fx-smoke .p2{ margin-left:12px;  animation-delay:calc(var(--delay) + .2s); }
  .fx-smoke .p3{ margin-left:-3px;  animation-delay:calc(var(--delay) + .4s); }
  .fx-smoke .p4{ margin-left:20px;  animation-delay:calc(var(--delay) + .6s); }
  .fx-smoke .p5{ margin-left:-22px; animation-delay:calc(var(--delay) + .8s); }
  .fx-smoke .p6{ margin-left:5px;   animation-delay:calc(var(--delay) + 1s); }

  /* intro flash sweep */
  .intro-flash{
    position:fixed; inset:0; z-index:50; pointer-events:none;
    background:linear-gradient(100deg, transparent 40%, rgba(255,255,255,.5) 48%, rgba(225,88,251,.35) 52%, transparent 60%);
    background-size:300% 100%;
    background-position:150% 0;
    animation:flashSweep 1.4s cubic-bezier(.2,.8,.2,1) .05s forwards;
  }
  @keyframes flashSweep{
    0%{ background-position:180% 0; opacity:1; }
    70%{ background-position:-40% 0; opacity:1; }
    100%{ background-position:-60% 0; opacity:0; }
  }

  /* ---------- layout ---------- */
  .wrap{
    position:relative; z-index:2;
    max-width:480px; margin:0 auto;
    min-height:100vh;
    padding-bottom:40px;
  }

  /* ---------- status bar ---------- */
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    font-family:'Share Tech Mono', monospace;
    font-size:11px; letter-spacing:.12em;
    color:var(--fog-dim);
    padding:12px 18px;
    opacity:0; animation:fadeIn .6s ease forwards;
  }
  .statusbar .dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--violet-soft); margin-right:6px;
    box-shadow:0 0 8px var(--violet-soft);
    animation:pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .statusbar .ping{ color:var(--violet-soft); }

  /* ---------- banner + avatar ---------- */
  .banner-frame{
    position:relative;
    width:100%;
    aspect-ratio:3/1;
    overflow:hidden;
    clip-path:inset(0 0 0 100%);
    animation:wipeIn 1s cubic-bezier(.3,.9,.2,1) .15s forwards;
  }
  @keyframes wipeIn{ to{ clip-path:inset(0 0 0 0); } }

  .banner-frame img{
    width:100%; height:100%; object-fit:cover;
    display:block;
    filter:saturate(1.15) contrast(1.05);
    transform:scale(1.08);
    animation:bannerSettle 1.2s ease .2s forwards;
  }
  @keyframes bannerSettle{ to{ transform:scale(1); } }

  .banner-frame::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, var(--void) 96%);
  }
  .banner-frame::before{
    content:'';
    position:absolute; top:0; left:-60%; z-index:2;
    width:60%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,.16), transparent);
    transform:skewX(-20deg) translateX(0);
    animation:shine 5s ease-in-out infinite 1.2s;
    will-change:transform;
    pointer-events:none;
  }
  @keyframes shine{
    0%, 55%{ transform:skewX(-20deg) translateX(0); }
    100%{ transform:skewX(-20deg) translateX(300%); }
  }

  .hero{
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    margin-top:-58px;
    position:relative; z-index:3;
    padding:0 18px 26px;
  }

  .avatar-core{
    position:relative;
    width:126px; height:126px;
    margin-bottom:18px;
  }
  .avatar-core .halo{
    position:absolute; inset:-12px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--magenta), var(--ice), var(--violet-soft), var(--violet));
    filter:blur(7px);
    opacity:.85;
    animation:spin 6s linear infinite;
  }
  .avatar-core .halo2{
    position:absolute; inset:-4px; border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    opacity:.6;
    animation:spin 10s linear infinite reverse;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .avatar-core .orbit{
    position:absolute; inset:-22px; border-radius:50%;
    animation:spin 5s linear infinite;
  }
  .avatar-core .orbit i{
    position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%;
    background:var(--ice); box-shadow:0 0 8px 2px var(--ice);
    transform:translate(-50%,-50%) translateX(75px);
  }
  .avatar-core .orbit.o2{ animation-duration:8s; animation-direction:reverse; }
  .avatar-core .orbit.o2 i{ background:var(--magenta); box-shadow:0 0 8px 2px var(--magenta); transform:translate(-50%,-50%) translateX(75px) translateY(30px); }

  .avatar{
    position:relative; z-index:2;
    width:126px; height:126px; border-radius:50%;
    overflow:hidden;
    border:3px solid var(--void);
    box-shadow:0 0 0 1px rgba(167,139,250,.5), 0 0 34px rgba(139,92,246,.5);
    /* iPadOS Safari sometimes fails to clip a border-radius container whose
       children use mix-blend-mode + animation (renders as a square instead
       of a circle). Forcing this element into its own compositing layer
       and adding a mask-based clip as a fallback fixes it reliably. */
    isolation:isolate;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    -webkit-mask-image:-webkit-radial-gradient(circle, #fff 100%, #fff 100%);
    mask-image:radial-gradient(circle, #fff 100%, #fff 100%);
  }
  .avatar::after{
    content:'';
    position:absolute; inset:-8px; z-index:-1; border-radius:50%;
    box-shadow:0 0 26px 8px rgba(139,92,246,.6);
    opacity:.55;
    animation:breathe 3.4s ease-in-out infinite;
    will-change:opacity, transform;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ opacity:.45; transform:scale(1); }
    50%{ opacity:.85; transform:scale(1.05); }
  }
  .avatar img{
    width:100%; height:100%; object-fit:cover;
    filter:grayscale(.55) contrast(1.15) brightness(.92);
  }
  .avatar .duotone{
    position:absolute; inset:0; z-index:2;
    background:linear-gradient(135deg, var(--violet) 0%, var(--magenta) 50%, var(--ice) 100%);
    mix-blend-mode:color;
    animation:duotoneShift 7s ease-in-out infinite;
  }
  .avatar .duotone2{
    position:absolute; inset:0; z-index:2;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.25), transparent 55%);
    mix-blend-mode:overlay;
  }
  @keyframes duotoneShift{
    0%,100%{ filter:hue-rotate(0deg); opacity:.9; }
    50%{ filter:hue-rotate(-25deg); opacity:1; }
  }

  .callsign{
    font-family:'Orbitron', sans-serif;
    font-weight:800; font-size:27px; letter-spacing:.04em;
    text-transform:uppercase;
    color:#fff;
    position:relative;
    text-shadow:0 0 18px rgba(167,139,250,.6);
    opacity:0; animation:fadeUp .6s ease .5s forwards;
  }
  .callsign .glitch{ position:relative; display:inline-block; }
  .callsign .glitch::before,
  .callsign .glitch::after{
    content:attr(data-text);
    position:absolute; left:0; top:0; width:100%;
    overflow:hidden;
    background:transparent;
  }
  .callsign .glitch::before{
    color:var(--magenta);
    animation:glitchTop 5s infinite linear;
    clip-path:inset(0 0 60% 0);
  }
  .callsign .glitch::after{
    color:var(--ice);
    animation:glitchBot 5s infinite linear;
    clip-path:inset(60% 0 0 0);
  }
  @keyframes glitchTop{
    0%, 92%, 100%{ transform:translate(0,0); opacity:0; }
    93%{ transform:translate(-2px,-1px); opacity:.85; }
    95%{ transform:translate(2px,1px); opacity:.85; }
    97%{ transform:translate(-1px,0); opacity:0; }
  }
  @keyframes glitchBot{
    0%, 91%, 100%{ transform:translate(0,0); opacity:0; }
    92%{ transform:translate(2px,1px); opacity:.85; }
    94%{ transform:translate(-2px,-1px); opacity:.85; }
    96%{ transform:translate(1px,0); opacity:0; }
  }

  .underline{
    width:64px; height:2px; margin:12px auto 0;
    background:linear-gradient(90deg, transparent, var(--violet-soft), var(--magenta), transparent);
    background-size:200% 100%;
    animation:underlineFlow 3s linear infinite;
    opacity:0; animation:fadeIn .6s ease .62s forwards, underlineFlow 3s linear infinite 1.2s;
  }
  @keyframes underlineFlow{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }

  .tagline{
    font-family:'Share Tech Mono', monospace;
    font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--fog-dim);
    margin-top:12px;
    opacity:0; animation:fadeUp .6s ease .68s forwards;
  }
  .tagline span{ color:var(--magenta); }

  .idtag{
    position:relative;
    display:inline-flex; align-items:center; gap:8px;
    margin-top:14px;
    padding:7px 14px;
    border-radius:999px;
    background:var(--panel);
    box-shadow:inset 0 0 0 1px rgba(167,139,250,.3);
    font-family:'Share Tech Mono', monospace;
    letter-spacing:.08em;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    opacity:0; animation:fadeUp .6s ease .74s forwards;
    transition:box-shadow .25s ease, transform .15s ease;
  }
  .idtag:hover{ box-shadow:inset 0 0 0 1px var(--violet-soft), 0 0 16px -4px var(--violet); }
  .idtag:active{ transform:scale(.96); }
  .idtag .idlabel{ font-size:10px; color:var(--fog-dim); }
  .idtag .idval{ font-size:13px; color:#fff; font-weight:600; }
  .idtag .idcopied{
    position:absolute; left:50%; bottom:calc(100% + 8px); transform:translate(-50%,4px);
    background:var(--magenta); color:#fff; font-size:10px; letter-spacing:.14em;
    padding:4px 9px; border-radius:6px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .idtag.copied .idcopied{ opacity:1; transform:translate(-50%,0); }

  /* ---------- loadout section ---------- */
  .section-label{
    display:flex; align-items:center; gap:10px;
    font-family:'Share Tech Mono', monospace;
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--fog-dim);
    margin:6px 18px 12px;
    opacity:0; animation:fadeUp .5s ease .78s forwards;
  }
  .section-label::after{
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, rgba(167,139,250,.4), transparent);
  }

  .loadout{ display:flex; flex-direction:column; gap:12px; padding:0 18px; }

  .slot{
    --rarity: var(--violet);
    position:relative;
    display:flex; align-items:center; gap:14px;
    padding:14px 16px;
    background:var(--panel);
    border-radius:10px;
    text-decoration:none; color:var(--fog);
    overflow:hidden;
    opacity:0; transform:translateY(14px);
    animation:fadeUp .55s ease forwards;
    transition:transform .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .slot:nth-child(1){ animation-delay:.86s; }
  .slot:nth-child(2){ animation-delay:.95s; }
  .slot:nth-child(3){ animation-delay:1.04s; }
  .slot:nth-child(4){ animation-delay:1.13s; }
  .slot:nth-child(5){ animation-delay:1.22s; }

  /* animated gradient border, always alive (transform-based: cheap, GPU-friendly) */
  .slot::before{
    content:'';
    position:absolute; inset:0;
    padding:1.5px;
    border-radius:10px;
    background:conic-gradient(from 0deg, var(--rarity), transparent 30%, transparent 70%, var(--rarity));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    animation:borderSpin 5s linear infinite;
    transform-origin:center;
    will-change:transform;
    opacity:.85;
  }
  @keyframes borderSpin{ to{ transform:rotate(360deg); } }

  /* inner glow layer */
  .slot::after{
    content:'';
    position:absolute; inset:0; border-radius:10px;
    background:radial-gradient(120px 60px at var(--mx,50%) var(--my,0%), rgba(255,255,255,.08), transparent 70%);
    pointer-events:none;
    opacity:0;
    transition:opacity .3s ease;
  }
  .slot:hover::after, .slot:active::after{ opacity:1; }

  .slot:hover, .slot:focus-visible{
    transform:translateY(-3px) scale(1.015);
    outline:none;
  }
  .slot:active{ transform:translateY(-1px) scale(.99); }

  .slot .shine-sweep{
    position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(75deg, transparent, rgba(255,255,255,.14), transparent);
    transform:skewX(-20deg);
    animation:autoShine 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  .slot:nth-child(1) .shine-sweep{ animation-delay:.2s; }
  .slot:nth-child(2) .shine-sweep{ animation-delay:1.1s; }
  .slot:nth-child(3) .shine-sweep{ animation-delay:2s; }
  .slot:nth-child(4) .shine-sweep{ animation-delay:2.9s; }
  .slot:nth-child(5) .shine-sweep{ animation-delay:3.6s; }
  @keyframes autoShine{
    0%, 15%{ left:-60%; }
    35%, 100%{ left:130%; }
  }

  .slot .icon{
    position:relative; z-index:2;
    width:36px; height:36px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--rarity);
    transition:transform .3s ease;
  }
  .slot:hover .icon{ transform:scale(1.15) rotate(-4deg); }
  .slot .icon svg{ width:20px; height:20px; }

  .slot .body{ position:relative; z-index:2; flex:1; min-width:0; display:flex; align-items:center; }
  .slot .label{
    font-weight:600; font-size:15.5px; letter-spacing:.01em;
    text-transform:uppercase;
    color:#efeaff;
    line-height:1.25;
  }
  .slot .chev{
    position:relative; z-index:2;
    color:var(--fog-dim);
    transition:transform .25s ease, color .25s ease;
    flex-shrink:0;
  }
  .slot:hover .chev{ transform:translateX(4px); color:var(--rarity); }

  .ripple{
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,.35);
    transform:scale(0);
    animation:rippleOut .6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleOut{ to{ transform:scale(1); opacity:0; } }

  .t-amethyst { --rarity: var(--violet-soft); }
  .t-violet   { --rarity: var(--violet); }
  .t-magenta  { --rarity: var(--magenta); }

  /* ---------- footer ---------- */
  .foot{
    margin-top:32px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:18px 18px 0;
    opacity:0; animation:fadeUp .6s ease 1.4s forwards;
    text-align:center;
  }
  .foot .divider{
    width:100%; max-width:200px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(167,139,250,.35), transparent);
    margin-bottom:4px;
  }
  .foot .legal{
    font-family:'Share Tech Mono', monospace;
    font-size:10px; letter-spacing:.08em;
    color:var(--fog-dim);
  }
  .foot .legal b{ color:var(--violet-soft); font-weight:600; }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ to{opacity:1;} }

  @media (max-width:380px){
    .callsign{ font-size:23px; }
  }

  /* ---------- large screens (tablet / desktop) ---------- */
  @media (min-width:700px){
    .wrap{ max-width:640px; }
    .banner-frame{ aspect-ratio:3.6/1; border-radius:0 0 18px 18px; }
    .hero{ margin-top:-84px; padding:0 32px 34px; }
    .avatar-core{ width:168px; height:168px; margin-bottom:22px; }
    .avatar{ width:168px; height:168px; }
    .avatar-core .orbit{ inset:-26px; }
    .avatar-core .orbit i{ transform:translate(-50%,-50%) translateX(96px); }
    .avatar-core .orbit.o2 i{ transform:translate(-50%,-50%) translateX(96px) translateY(38px); }
    .callsign{ font-size:34px; }
    .statusbar{ padding:16px 26px; font-size:12px; }
    .slot{ padding:16px 20px; }
  }

  @media (min-width:1000px){
    .wrap{ max-width:720px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="intro-flash"></div>
<div class="backdrop"></div>
<div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="grid-bg"></div>
<div class="vignette"></div>
<div class="page-sweep"></div>
<div class="sparkles" id="sparkles"></div>
<div class="embers" id="embers"></div>
<div class="nades" id="nades"></div>

<div class="wrap">

  <div class="statusbar">
    <span><span class="dot"></span>SIGNAL: ONLINE</span>
    <span>PING: <span class="ping" id="ping">…</span>ms</span>

  };
  const NADE_TYPES = ['frag','smoke','molotov','c4','frag','smoke','molotov','frag'];
  const NADE_COUNT = 10;
  // radiating debris angles (deg) reused per explosion, gives a natural shrapnel burst
  const DEBRIS_ANGLES = [15, 65, 110, 160, 205, 250, 300, 340];

  function burstMarkup(){
    let s = '<span class="ring"></span><span class="ring2"></span>';
    DEBRIS_ANGLES.forEach((deg, idx)=>{
      const rad = deg * Math.PI / 180;
      const dist = 26 + Math.random()*14;
      const dx = (Math.cos(rad) * dist).toFixed(1);
      const dy = (Math.sin(rad) * dist).toFixed(1);
      s += '<span class="debris d'+idx+'" style="--dx:'+dx+'px; --dy:'+dy+'px; animation-delay:calc(var(--delay) + '+(idx*0.015).toFixed(2)+'s);"></span>';
    });
    return s;
  }

  for(let i=0;i<NADE_COUNT;i++){
    const type = NADE_TYPES[i % NADE_TYPES.length];
    const el = document.createElement('div');
    el.className = 'nade';

    // stratified horizontal placement so grenades spread evenly across the FULL width
    const segment = 100 / NADE_COUNT;
    const left = (segment * i) + Math.random() * segment * 0.85;

    const size = 30 + Math.random()*26;
    // smoke lingers longer, so give it a longer overall loop duration
    const dur = type === 'smoke' ? (9 + Math.random()*7) : (6 + Math.random()*6);
    const startOffset = Math.random()*dur;
    const stop = 38 + Math.random()*48;
    const rot = (Math.random()<.5?1:-1) * (360 + Math.random()*360);
    el.style.cssText =
      'left:'+left.toFixed(2)+'vw; width:'+size.toFixed(0)+'px; '+
      '--dur:'+dur.toFixed(2)+'s; --delay:'+(-startOffset).toFixed(2)+'s; '+
      '--stop:'+stop.toFixed(1)+'vh; --rot:'+rot.toFixed(0)+'deg;';

    let fxInner = '';
    if(type === 'smoke'){
      fxInner = '<span class="puff p1"></span><span class="puff p2"></span><span class="puff p3"></span>'+
                '<span class="puff p4"></span><span class="puff p5"></span><span class="puff p6"></span>';
    } else if(type === 'molotov'){
      fxInner = burstMarkup() +
        '<span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>';
    } else {
      fxInner = burstMarkup();
    }

    el.innerHTML =
      '<div class="nade-body"><img class="nade-img" src="'+NADE_IMG[type]+'" alt=""></div>'+
      '<div class="nade-fx fx-'+type+'">'+fxInner+'</div>';

    nadeLayer.appendChild(el);
  }

  // pointer-follow glow + ripple on tap for each slot
  document.querySelectorAll('.slot').forEach(slot=>{
    slot.addEventListener('pointermove', (ev)=>{
      const r = slot.getBoundingClientRect();
      slot.style.setProperty('--mx', ((ev.clientX - r.left)/r.width*100)+'%');
      slot.style.setProperty('--my', ((ev.clientY - r.top)/r.height*100)+'%');
    });
    slot.addEventListener('pointerdown', (ev)=>{
      const r = slot.getBoundingClientRect();
      const rip = document.createElement('span');
      rip.className = 'ripple';
      const size = Math.max(r.width, r.height) * 1.6;
      rip.style.width = rip.style.height = size+'px';
      rip.style.left = (ev.clientX - r.left - size/2)+'px';
      rip.style.top = (ev.clientY - r.top - size/2)+'px';
      slot.appendChild(rip);
      setTimeout(()=>rip.remove(), 650);
    });
  });

  setTimeout(()=>{ document.querySelector('.intro-flash')?.remove(); }, 1600);

  const idtag = document.getElementById('idtag');
  idtag?.addEventListener('click', async ()=>{
    const text = '5274595497';
    let ok = false;
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    }catch(e){ ok = false; }
    if(!ok){
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      }catch(e){ ok = false; }
    }
    idtag.classList.add('copied');
    idtag.querySelector('.idcopied').textContent = ok ? 'COPIED' : 'ID: 5274595497';
    setTimeout(()=>{ idtag.classList.remove('copied'); idtag.querySelector('.idcopied').textContent = 'COPIED'; }, 1600);
  });
</script>
